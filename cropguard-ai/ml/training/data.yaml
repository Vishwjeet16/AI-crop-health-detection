# CropGuard AI — YOLO dataset config (ultralytics format)
#
# GENERATED by ml/dataset/prepare_dataset.py — do not hand-edit. The class
# ids below are the ids the label files were written with, so editing this
# list without regenerating the dataset silently mistrains the model.
#
# Names are the contract with the backend: ai_service.py passes
# model.names[cls_id] through as the detection's `class_`, and
# recommendation_service.TEMPLATES is keyed on exactly these strings.
#
# "healthy" is deliberately not a class. Healthy leaves are included as
# background images with empty label files, and ai_service.py treats an
# empty detection list as healthy.

path: ../dataset/yolo_format
train: images/train
val: images/val
test: images/test

names:
  0: early_blight        # 254 boxes
  1: late_blight         # 204 boxes
  2: leaf_curl           # 442 boxes
  3: bacterial_spot      # 296 boxes
  4: septoria_leaf_spot  # 227 boxes
  5: leaf_mold           # 169 boxes
  6: mosaic_virus        # 95 boxes
  7: powdery_mildew      # 154 boxes
  8: corn_leaf_blight    # 200 boxes
  9: corn_rust           # 63 boxes
  10: gray_leaf_spot      # 40 boxes
  11: apple_rust          # 113 boxes
  12: apple_scab          # 81 boxes
  13: black_rot           # 74 boxes
